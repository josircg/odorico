{% extends 'base_header.html' %}
{% load i18n static %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="position-relative py-4 py-xl-5" style="margin-top: 0px;">
    <div class="container position-relative">
        <div class="row d-flex justify-content-center">
            <div class="col-md-10 col-xl-8"> <!-- Largura da coluna ajustada -->
                <div class="card" style="border-style: none; width: 100%; height: 100%; border-radius: 40px; box-shadow: 5px 5px 8px 2px rgba(111, 66, 193, 0.55); max-width: 800px;"> <!-- Card mais largo -->
                    <div class="card-body d-flex flex-column align-items-center" style="padding: 2rem;"> <!-- Conteúdo centralizado -->
                        <a href="{% url 'home' %}" style="display: block; width: 60%; height: 10vh; margin-bottom: 1.5rem;">
                            <div style="width: 100%; height: 100%; background: url('{% static 'img/login-Odorico.png' %}') center / contain no-repeat;"></div>
                        </a>
                        <form method="post" style="width: 100%;"> <!-- Formulário com largura máxima -->
                            {% csrf_token %}
                            <div class="mb-3 text-start" style="width: 100%;"> <!-- Texto alinhado à esquerda -->
                                <h1 style="font-size: 30px;">Resetar Senha</h1>
                                <p>Esqueceu sua senha? Insira seu e-mail abaixo e enviaremos instruções para criar uma nova senha.</p>
                            </div>
                            <div class="form-row field-email text-start" style="width: 100%;"> <!-- Input ocupando 100% da largura -->
                                <div class="errornote" style="color: red; margin-bottom: 20px;">
                                    <p>{{ form.email.errors }}</p>
                                </div>

                                <label for="id_email">{% trans 'Email address:' %}</label>
                                <!-- Sobrescrevendo o campo de e-mail com classes CSS personalizadas -->
                                <input type="email" name="email" id="id_email" class="form-control form-control-lg" style="width: 100%; padding: 5px; font-size: 16px;" required>
                            </div>
                            <div class="d-flex justify-content-center" style="width: 100%; margin-top: 20px;"> <!-- Botão centralizado -->
                                <button type="submit" class="btn btn-primary" style="width: 100%; max-width: 250px;">Resetar Senha</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
