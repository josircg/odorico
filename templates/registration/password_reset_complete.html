{% extends 'base.html' %}
{% load i18n static %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="position-relative py-4 py-xl-5" style="margin-top: 0px;">
    <div class="container position-relative">
        <div class="row d-flex justify-content-center">
            <div class="col-md-10 col-xl-8"> <!-- Largura da coluna ajustada -->
                <div class="card" style="border-style: none; width: 100%; height: 100%; border-radius: 40px; box-shadow: 5px 5px 8px 2px rgba(111, 66, 193, 0.55); max-width: 800px;"> <!-- Card mais largo -->
                    <div class="card-body d-flex flex-column align-items-center" style="padding: 2rem;"> <!-- Conteúdo centralizado -->
                        <a href="{% url 'home' %}" style="display: block; width: 60%; height: 10vh; margin-bottom: 1.5rem;">
                            <div style="width: 100%; height: 100%; background: url('{% static 'img/login-Odorico.png' %}') center / contain no-repeat;"></div>
                        </a>
                        <div class="text-center" style="width: 100%;"> <!-- Texto alinhado à esquerda -->
                            <h1 style="font-size: 30px;">{% trans 'Password reset complete' %}</h1>
                            <p style="color: rgb(51, 128, 0);"><strong>Senha redefinida com sucesso, você pode agora fazer o login</strong></p>
                        </div>
                        <div class="d-flex justify-content-center" style="width: 100%; margin-top: 20px;"> <!-- Botão centralizado -->
                            <a href="/login/" class="btn btn-primary" style="width: 100%; max-width: 250px;">{% trans 'Log in' %}</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
